<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>FrWordle — Wordle français</title>
    <link rel="icon" href="image/icon.png">
    <style>
        @import url('css.css');
    </style>
</head>

<body>
    <div class="app-container">
        <nav class="nav-bar">
            <div class="logo">FrWordle</div>
            <div class="nav-links">
                <button id="introBtn">📖 Introduction</button>
            </div>
        </nav>

        <div class="word-grid" id="wordGrid"></div>
        <div class="keyboard" id="virtualKeyboard"></div>

        <!-- 新页脚 (简约仿 footer 文件) -->
        <footer class="app-footer">
            <div class="footer-main">
                <div class="footer-brand">
                    <span class="name">FrWordle</span>
                    <span class="version">V4-Beta</span>
                    <div style="font-size:0.75rem; margin-top:4px;">Jeu éducatif français</div>
                </div>
                <div class="footer-links">
                    <a href="#" id="footerIntroBtn">📖 Règles</a>
                    <a href="#" id="footerVersionBtn">ℹ️ À propos</a>
                    <a href="https://dorngames.gamer.gd" target="_blank" rel="noopener">🌐 Site officiel</a>
                    <a href="#" id="footerContactBtn">📧 Contact</a>
                </div>
            </div>
            <div class="footer-copyright">
                © 2026 FrWordle · Koloyaaa (DornGames) · Tous droits réservés
                <br><a href="#" style="color:#5b3e7e; text-decoration:none;" id="legalLink">Mentions légales</a>
            </div>
        </footer>
    </div>

    <!-- Modal -->
    <div id="globalModal" class="modal-overlay">
        <div class="modal-card">
            <button class="modal-close" id="closeModalBtn">&times;</button>
            <h3 id="modalTitle"></h3>
            <div id="modalBody"></div>
            <div id="modalExtra"></div>
        </div>
    </div>

    <script src="dictionary.js"></script>
    <script src="js.js"></script>
</body>

</html>
